<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple vertical gradient bar, centered -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffff44;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4444ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main bar -->
  <rect x="7" y="5" width="10" height="14" fill="url(#grad)" stroke="currentColor" stroke-width="2" rx="1.5"/>
</svg>
